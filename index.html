<html>
<head>
<title>Raster Graphics</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <canvas id="canvas" width="200" height="200"
  style="width:500px; height:500px; border:1px solid #000; image-rendering: pixelated;">
</canvas>

<div class="button-info">
  
  <button onclick="tool='pencil'">✏️</button>
  <button onclick="tool='line'">&HorizontalLine;</button>
  <button onclick="tool='rect'">▭</button>
  <button onclick="tool='ellipse'">◯</button>
  <button onclick="tool='eraser'">🧽</button>
  
  
</div>
<br><br>

<input class="color-info" type="color" id="colorPicker" value="#000000">

<input class="PB-range-slider"  type="range" id="size" min="1" max="20" value="5">

</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const imageData = ctx.createImageData(canvas.width, canvas.height);
const pixels = imageData.data; // Array of color [R,G,B,A, R,G,B,A, ...]


let isDragging = false; 
let previousX = 0;
let previousY = 0;
let r = 0, g = 0, b = 0, a = 255; // Default color
let brushsize = 5;
let startX = 0;
let startY = 0;
let backupImage;

let tool = "pencil";


const colorPicker = document.getElementById("colorPicker");

colorPicker.addEventListener("input", () => {

    const hex = colorPicker.value;

    r = parseInt(hex.substr(1,2),16);
    g = parseInt(hex.substr(3,2),16);
    b = parseInt(hex.substr(5,2),16);

});


document.getElementById("size").addEventListener("input",(e)=>{

  brushsize = Number(e.target.value);
})




function putPixel(x, y, r, g, b, a = 255, size = 1) {
  const half = Math.floor(size / 2);

  for (let yy = -half; yy <= half; yy++) {
    for (let xx = -half; xx <= half; xx++) {
      const px = x + xx;
      const py = y + yy;

      if (px < 0 || py < 0 || px >= canvas.width || py >= canvas.height)
        continue;

      const idx = (py * canvas.width + px) * 4;
      pixels[idx] = r;
      pixels[idx + 1] = g;
      pixels[idx + 2] = b;
      pixels[idx + 3] = a;
    }
  }
}


function drawLine(x1, y1, x2, y2, r, g, b, a = 255) {
  const dx = Math.abs(x2 - x1);
  const dy = Math.abs(y2 - y1);

 


  if(dx > dy) {
    const m = (y2 - y1) / (x2 - x1);
    const c = y1 - m * x1;
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
      const y = Math.round(m * x + c);
      putPixel(x, y, r, g, b, a,brushsize);
    }
  } else {
    const m = (x2 - x1) / (y2 - y1);
    const c = x1 - m * y1;
    for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
      const x = Math.round(m * y + c);
      putPixel(x, y, r, g, b, a,brushsize);
    }
  }
}

function drawRect(x1, y1, x2, y2, r, g, b, a = 255) {
  drawLine(x1, y1, x2, y1, r, g, b, a); // Top edge
  drawLine(x2, y1, x2, y2, r, g, b, a); // Right edge
  drawLine(x2, y2, x1, y2, r, g, b, a); // Bottom edge
  drawLine(x1, y2, x1, y1, r, g, b, a); // Left edge
}

function drawRectFilled(x1, y1, x2, y2, r, g, b, a = 255) {
  for (let y = y1; y <= y2; y++) {
    for (let x = x1; x <= x2; x++) {
      putPixel(x, y, r, g, b, a);
    }
  }
}

function drawRectGradient(x1, y1, x2, y2, r1, g1, b1, r2, g2, b2) {
  for (let y = y1; y <= y2; y++) {
    const t = (y - y1) / (y2 - y1);
    const r = Math.round(r1 * (1 - t) + r2 * t);
    const g = Math.round(g1 * (1 - t) + g2 * t);
    const b = Math.round(b1 * (1 - t) + b2 * t);
    for (let x = x1; x <= x2; x++) {
      putPixel(x, y, r, g, b);
    }
  }
}

function drawEllipse(cx, cy, rx, ry, r, g, b, a ) {
  for (let y = -ry; y <= ry; y++) {
    for (let x = -rx; x <= rx; x++) {
      if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1) {
        putPixel(cx + x, cy + y, r, g, b, a);
      }
    }
  }
}

function drawSprite(sprite, x, y, r, g, b, a = 255) {
  for (let j = 0; j < sprite.length; j++) {
    for (let i = 0; i < sprite[j].length; i++) {
      if (sprite[j][i] === 1) {
        putPixel(x + i, y + j, r, g, b, a);
      }
    }
  }
}



function toScaledMousePos(posX, posY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: Math.floor((posX - rect.left) * scaleX),
    y: Math.floor((posY - rect.top) * scaleY)
  };
}

function drawBrushLine(x1, y1, x2, y2, cr, cg, cb) {

    const dx = x2 - x1;
    const dy = y2 - y1;

    const dist = Math.max(Math.abs(dx), Math.abs(dy));

    for (let i = 0; i <= dist; i++) {

        const t = i / dist;

        const x = Math.round(x1 + dx * t);
        const y = Math.round(y1 + dy * t);

        putPixel(x, y, cr, cg, cb, 255, brushsize);
    }
}







canvas.addEventListener('click', (event) => {

});

canvas.addEventListener('mousedown', (event) => {
  isDragging = true;
  console.log('Mouse down', event.offsetX, event.offsetY);



  const pos = toScaledMousePos(event.clientX, event.clientY);
  previousX = pos.x;
  previousY = pos.y;

  startX = pos.x;
  startY = pos.y;

  // backupImage = new ImageData(
  //   new Uint8ClampedArray(imageData.data),
  //   imageData.width,
  //   imageData.height

  // );

});

canvas.addEventListener('mouseup', (event) => {
  isDragging = false;
  console.log('Mouse up', event.offsetX, event.offsetY);

  const pos = toScaledMousePos(event.clientX,event.clientY);

  if(tool === 'line'){
    drawLine(startX, startY, pos.x, pos.y, r, g, b);
    ctx.putImageData(imageData, 0, 0);
  }
  

});

canvas.addEventListener('mousemove', (event) => {

  const { x, y } = toScaledMousePos(event.clientX, event.clientY);

  if(isDragging) {
    const pos = toScaledMousePos(event.clientX,event.clientY);

    if(tool === 'pencil'){
      drawBrushLine(previousX, previousY, x, y, r, g, b);

    }

    else if(tool === 'eraser'){
      drawBrushLine(previousX, previousY, x, y,255,255,255);
    }
    else if(tool === 'rect'){
      drawRect(startX,startY,pos.x,pos.y,r,g,b)
    }
     else if(tool === 'ellipse'){

      const rx = Math.abs(x - startX);
      const ry = Math.abs(y - startY);


      drawEllipse(startX,startY,rx,ry,r,g,b,a = 255);

    }
   
    
    
    ctx.putImageData(imageData, 0, 0);
  }
  previousX = x;
  previousY = y;
});

window.addEventListener('keydown', (event) => {
  console.log('Key down:', event.key);
 

  if (event.key === '+') {
    brushsize++;
  }
else if (event.key === '-') {
    brushsize = Math.max(1, brushsize - 1);
  }

  


});
window.addEventListener('keyup', (event) => {
  console.log('Key up:', event.key);
});


ctx.putImageData(imageData, 0, 0);

</script>
</body>
</html>
